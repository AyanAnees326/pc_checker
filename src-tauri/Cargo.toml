[package]
name = "pc-checker"
version = "0.1.0"
description = "Pre-purchase hardware inspection tool for used Windows laptops and PCs"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pc_checker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }

# WMI is only a fallback source (battery mirror, Win32_PhysicalMemory). It pulls its
# own `windows` version; that is fine because we never pass types across the boundary.
wmi = "0.14"
roxmltree = "0.20"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ProcessStatus",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
]

[features]
# Tauri's custom-protocol is enabled by the CLI on release builds.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# The stress kernels must stay fast even in dev builds, otherwise a "stress test"
# measures our own overhead instead of the machine's thermal behaviour.
[profile.dev.package."pc-checker"]
opt-level = 2
